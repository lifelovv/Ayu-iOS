workflows:
  ayu-ios-ipa:
    name: Ayu iOS - IPA for re-signing
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "27.1"
      groups:
        - telegram_api
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
    scripts:
      - name: Check toolchain and generate private configuration
        script: python3 tools/ayu/ci.py configure
      - name: Apply Ayu features and run privacy and history model tests
        script: |
          set -euo pipefail
          git apply --check ayu-privacy.patch
          git apply ayu-privacy.patch
          git apply --check ayu-history.patch
          git apply ayu-history.patch
          swiftc -warnings-as-errors submodules/TelegramCore/Sources/Settings/AyuPrivacySettings.swift submodules/TelegramCore/Sources/Settings/AyuMessageHistory.swift tools/ayu/tests/main.swift -o build-input/ayu/privacy-tests
          build-input/ayu/privacy-tests
      - name: Install Metal compiler component
        script: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Download pinned submodules
        script: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8
          git submodule status --recursive > build-input/ayu/submodules.txt
          python3 -c 'from pathlib import Path; s=Path("build-input/ayu/submodules.txt").read_text().splitlines(); assert s and all(x.startswith(" ") for x in s), "Uninitialized or mismatched submodules"'
          test -f submodules/tlottie/tlottie/src/lib.rs
          test -d third-party/wallet-engine/wallet-engine/vendor/ton/resources
      - name: Import upstream test signing identity
        script: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
      - name: Build device IPA with test signature
        script: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/ayu-bazel-cache" \
            build \
            --configurationPath=build-input/ayu/configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${BUILD_NUMBER:-1}" \
            --outputBuildArtifactsPath=build/ayu-artifacts
          python3 tools/ayu/ci.py collect
    artifacts:
      - build/ayu-artifacts/Ayu-iOS-resign-required.ipa
      - build/ayu-artifacts/Telegram.DSYMs.zip
      - build/ayu-artifacts/build-info.json
    cache:
      cache_paths:
        - $HOME/ayu-bazel-cache

  ayu-ios-simulator:
    name: Ayu iOS - simulator compile check
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true
    environment:
      xcode: "27.1"
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        # Compilation only: these values cannot authorize a Telegram account.
        TELEGRAM_API_ID: "1"
        TELEGRAM_API_HASH: "00000000000000000000000000000000"
    scripts:
      - name: Check toolchain and generate private configuration
        script: python3 tools/ayu/ci.py configure
      - name: Apply Ayu features and run privacy and history model tests
        script: |
          set -euo pipefail
          git apply --check ayu-privacy.patch
          git apply ayu-privacy.patch
          git apply --check ayu-history.patch
          git apply ayu-history.patch
          swiftc -warnings-as-errors submodules/TelegramCore/Sources/Settings/AyuPrivacySettings.swift submodules/TelegramCore/Sources/Settings/AyuMessageHistory.swift tools/ayu/tests/main.swift -o build-input/ayu/privacy-tests
          build-input/ayu/privacy-tests
      - name: Install Metal compiler component
        script: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Download pinned submodules
        script: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8
          git submodule status --recursive > build-input/ayu/submodules.txt
          python3 -c 'from pathlib import Path; s=Path("build-input/ayu/submodules.txt").read_text().splitlines(); assert s and all(x.startswith(" ") for x in s), "Uninitialized or mismatched submodules"'
          test -f submodules/tlottie/tlottie/src/lib.rs
          test -d third-party/wallet-engine/wallet-engine/vendor/ton/resources
      - name: Build simulator app
        script: |
          set -euo pipefail
          printf '%s\n' 'build --//Telegram:disableProvisioningProfiles' >> .bazelrc
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/ayu-bazel-cache" \
            build \
            --configurationPath=build-input/ayu/configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber="${BUILD_NUMBER:-1}" \
            --outputBuildArtifactsPath=build/ayu-simulator
    artifacts:
      - build/ayu-simulator/Telegram.ipa
    cache:
      cache_paths:
        - $HOME/ayu-bazel-cache
